# Katman — Decap CMS yapılandırması
# Öğrenciler kendi GitHub hesaplarıyla girer; repo otomatik fork'lanır,
# gönderiler pull request olarak gelir (open authoring + editorial workflow).

backend:
  name: github
  repo: sadettindemirel/katman
  branch: main
  open_authoring: true
  # base_url verilmezse Decap, Netlify'ın OAuth sağlayıcısını (api.netlify.com) kullanır.
  # Kendi OAuth proxy'nizi kullanırsanız: base_url: https://<proxy-adresi>
  commit_messages:
    create: "Yeni yazı: {{slug}}"
    update: "Yazı güncellendi: {{slug}}"
    delete: "Yazı silindi: {{slug}}"
    uploadMedia: "Medya yüklendi: {{path}}"
    deleteMedia: "Medya silindi: {{path}}"
    openAuthoring: "{{message}}"

publish_mode: editorial_workflow
locale: tr
site_url: https://katmanlar.netlify.app
display_url: https://katmanlar.netlify.app
logo:
  src: /admin/katman-logo.svg
  show_in_header: true

# Decap bu ayarı zorunlu tutuyor. Görseller harici barındırılır (URL ile eklenir);
# bu klasöre yüklenen dosyalar PR incelemesinde reddedilir.
media_folder: static/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: yazilar
    label: Yazılar
    label_singular: Yazı
    description: "Vize ve final çalışmaların. Zorunlu alanları doldurmadan gönderemezsin."
    folder: content/yazilar
    create: true
    # Silme açık. Yayımlanmış bir yazıyı siteden gerçekten kaldıran yalnızca yönetici
    # hesabıdır (main dalına doğrudan "Yazı silindi" commit'i). Öğrenciler kendi
    # gönderilmemiş taslaklarını silebilir.
    delete: true
    # Dosya adı = kalıcı adres. Yayından sonra değiştirilmez.
    slug: "{{year}}-{{slug}}"
    preview_path: "yazilar/{{slug}}/"
    # Listede yayın ve oluşturulma tarihi görünür; sıralama menüsünde son güncelleme de var.
    summary: "{{title}} — {{author}} ({{donemler}}, {{odevler}}) · Yayın: {{date | date('DD.MM.YYYY')}} · Oluşturulma: {{olusturma | date('DD.MM.YYYY')}}"
    sortable_fields:
      - { field: date, label: Yayın tarihi }
      - { field: olusturma, label: Oluşturulma tarihi }
      - { field: commit_date, label: Son güncelleme }
      - { field: title, label: Başlık }
      - { field: author, label: Yazar }
    view_filters:
      - label: Vize
        field: odevler
        pattern: Vize
      - label: Final
        field: odevler
        pattern: Final
    view_groups:
      - label: Dönem
        field: donemler
    fields:
      # --- Temel bilgiler ---
      - label: Başlık
        name: title
        widget: string

      - label: Özet
        name: description
        widget: text
        hint: "En fazla 200 karakter. Anasayfada ve paylaşım kartlarında görünür."
        pattern: ['^[\s\S]{1,200}$', "Özet en fazla 200 karakter olmalı."]

      - label: Yazar (ad soyad)
        name: author
        widget: string
        hint: "Yalnızca adın ve soyadın. Öğrenci numarası yazma."

      - label: Ders adı
        name: ders
        widget: string

      - label: Dönem
        name: donemler
        widget: string
        default: "2026 Güz"
        hint: "Biçim: YIL Güz / Bahar / Yaz (örnek: 2026 Güz)"
        pattern: ['^\d{4} (Güz|Bahar|Yaz)$', "Örnek biçim: 2026 Güz"]

      - label: Ödev türü
        name: odevler
        widget: select
        options: [Vize, Final]

      - label: Yayın tarihi
        name: date
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD.MM.YYYY"
        time_format: "HH:mm"

      # Yazı ilk açıldığında otomatik dolar, değiştirilemez (widget: katman-cms.js).
      # Sitede gösterilmez; panelde listeleme ve sıralama içindir.
      - label: Oluşturulma tarihi
        name: olusturma
        widget: olusturma
        required: false

      # --- Kapak görseli (harici URL) ---
      - label: Kapak görseli
        name: cover
        widget: object
        required: false
        collapsed: false
        fields:
          - label: Görsel adresi (https://...)
            name: image
            widget: string
            required: false
            hint: "Görseli kendi hesabında (ör. Flickr, Imgur, Wikimedia) barındır ve doğrudan bağlantısını yapıştır. Görselin üzerine sağ tıklayıp \"Görsel adresini kopyala\"yı kullan; \"İndir\" düğmesinin bağlantısı çalışmaz. Dosya yükleme kapalıdır."
            pattern: ['^$|^https://\S+$', "https:// ile başlayan bir adres olmalı."]
          - label: Alternatif metin
            name: alt
            widget: string
            required: false
            hint: "Görme engelli okurlar için görseli bir cümleyle anlat. Görsel eklediysen zorunlu."
          - label: Görsel kaynağı / telif notu
            name: caption
            widget: string
            required: false
            hint: "Örnek: Fotoğraf: Ad Soyad, CC BY 4.0"

      # --- Etiketler ---
      - label: Konu etiketleri
        name: tags
        widget: list
        allow_add: true
        hint: "Virgülle ayır. Örnek: iklim, deprem, ulaşım"

      # --- Gövde ---
      - label: Metin
        name: body
        widget: markdown
        hint: "Düğmelerle biçimlendir. Görsel ve gömme (Flourish, Datawrapper, iframe...) eklemek için araç çubuğundaki + düğmesini kullan. Markdown biliyorsan sağ üstten Markdown moduna geçebilirsin."
        # Zengin metin (WordPress benzeri) varsayılan; markdown bilen için ham mod da açık.
        modes: [rich_text, raw]
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        # "image" ve "gomme" static/admin/katman-cms.js içinde tanımlı: görsel yalnızca
        # adresle eklenir (yükleme yok), gömme kodu sitede olduğu gibi çalışır.
        editor_components: [image, gomme]
        # Güvenlik için açık kalmalı: gömmeler önizlemede yalıtılmış çerçevede çalışır,
        # metne elle yazılmış HTML ise temizlenir (bkz. katman-gomme.js).
        sanitize_preview: true

      # --- Veri kaynakları (metnin altında) ---
      - label: Veri kaynakları
        name: veri_kaynaklari
        widget: list
        required: false
        summary: "{{fields.ad}}"
        hint: "Yazıda kullandığın verilerin kaynakları. Yazının altında liste olarak görünür."
        fields:
          - label: Kaynak adı
            name: ad
            widget: string
          - label: Bağlantı
            name: baglanti
            widget: string
            required: false
            pattern: ['^$|^https?://\S+$', "http:// ya da https:// ile başlamalı."]
          - label: Veri tarihi
            name: tarih
            widget: string
            required: false
            hint: "Verinin ait olduğu dönem ya da erişim tarihi. Örnek: 2025, Mart 2026"

      - label: Taslak (yayımlanmasın)
        name: draft
        widget: boolean
        default: false
        required: false
        hint: "İşaretliyse yazı birleştirilse bile sitede görünmez."

  # --- Yönetici: site sayfaları ve menü ---
  # Öğrenciler de görür; onların buradaki değişiklikleri PR olarak gelir, birleştirmeyin.
  - name: sayfalar
    label: Sayfalar
    label_singular: Sayfa
    description: "Hakkında gibi site sayfaları (yalnızca yönetici). Yeni sayfayı menüye eklemek için Site menüsü'nü kullan."
    folder: content/sayfalar
    create: true
    delete: true
    # Dosya adı = adres: content/sayfalar/hakkinda.md → /hakkinda/
    slug: "{{slug}}"
    preview_path: "{{slug}}/"
    fields:
      - label: Başlık
        name: title
        widget: string
      - label: Kısa açıklama
        name: description
        widget: string
        required: false
        hint: "Arama motorları ve paylaşım kartları için tek cümle."
      - label: Metin
        name: body
        widget: markdown
        modes: [rich_text, raw]
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image, gomme]
        sanitize_preview: true

  - name: site
    label: Site ayarları
    description: "Yalnızca yönetici."
    editor:
      preview: false
    files:
      - name: menu
        label: Site menüsü
        file: config/_default/menus.yaml
        fields:
          - label: Ana menü
            name: main
            widget: list
            summary: "{{fields.weight}} · {{fields.name}} → {{fields.url}}"
            fields:
              - label: Görünen ad
                name: name
                widget: string
              - label: Adres
                name: url
                widget: string
                hint: "Site içi: /hakkinda/ (Sayfalar'daki dosya adı), /arsiv/, /ara/. Dış bağlantı: https://..."
                pattern: ['^(/[a-z0-9/-]*|https://\S+)$', "/hakkinda/ ya da https://... biçiminde olmalı."]
              - label: Sıra
                name: weight
                widget: number
                value_type: int
                hint: "Küçük sayı solda görünür (10, 20, 30...)."

# Vitrin ve yarışma bilgileri öğrenci formunda yoktur; yönetici
# data/vitrin.yaml ve data/yarismalar.yaml dosyalarını GitHub'da düzenler.
